<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inegral-Challenge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
            background-color: #f8f9fa;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        input {
            padding: 10px;
            font-size: 18px;
            width: 120px;
            text-align: center;
            margin-top: 15px;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
        }

        .success {
            color: green;
        }

        .error {
            color: crimson;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🔬 Integral-Challenge</h1>

    <p>
        Bitte weisen Sie nach, dass Sie integrieren können.
    </p>

    <p>
        Berechne:
    </p>

    <h2>∫₀¹ x² dx = ?</h2>

    <input type="text" id="answer" placeholder="Antwort">
    <br>
    <button onclick="checkAnswer()">Absenden</button>

    <div id="result"></div>
</div>

<script>
function checkAnswer() {
    const answer = document.getElementById("answer").value.trim();
    const result = document.getElementById("result");

    if (
        answer === "1/3" ||
        answer === "0.333" ||
        answer === "0,333" ||
        answer === "0.3333" ||
        answer === "0,3333"
    ) {
        result.innerHTML = `
            <h2 class="success">✅ Authentifizierung erfolgreich</h2>
            <p>Du hast erfolgreich bewiesen, dass du echt krass im Integrieren bist.</p>
            <p>Die eigentliche Frage lautet allerdings:</p>
            <h2>☕ Hättest du Lust, sich mit mir am Wochenende zu treffen?</h2>
        `;
    } else {
        result.innerHTML = `
            <p class="error">
                ❌ Authentifizierung fehlgeschlagen.<br>
                Vielleicht noch einmal integrieren. 😉
            </p>
        `;
    }
}
</script>

</body>
</html>
